name: RoadSeva CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Lint + Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio httpx ruff

      - name: Lint with ruff
        run: |
          ruff check . --config ruff.toml
        continue-on-error: false

      - name: Run unit tests
        env:
          ENVIRONMENT: test
          SECRET_KEY: test-secret-key-for-ci-only
        run: |
          pytest tests/test_database.py -v --tb=short

      - name: Run route integration tests
        env:
          ENVIRONMENT: test
          SECRET_KEY: test-secret-key-for-ci-only
        run: |
          pytest tests/test_routes.py -v --tb=short
        continue-on-error: false

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: .pytest_cache/

      - name: Notify on test failure
        if: failure()
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: |
          if [ -n "$RESEND_API_KEY" ]; then
            curl -s -X POST "https://api.resend.com/emails" \
              -H "Authorization: Bearer $RESEND_API_KEY" \
              -H "Content-Type: application/json" \
              -d '{
                "from": "RoadSeva CI <onboarding@resend.dev>",
                "to": ["ainimireddyvineeth25@gmail.com"],
                "subject": "🚨 RoadSeva CI FAILED — ${{ github.ref_name }}",
                "html": "<p><b>Commit:</b> ${{ github.sha }}</p><p><b>Branch:</b> ${{ github.ref_name }}</p><p><b>By:</b> ${{ github.actor }}</p><p><a href=\"https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}\">View failure details</a></p>"
              }'
          else
            echo "RESEND_API_KEY not set — skipping notification"
          fi

  deploy:
    name: Deploy to Render
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Trigger Render deploy
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -n "$RENDER_DEPLOY_HOOK" ]; then
            curl -X POST "$RENDER_DEPLOY_HOOK" \
              -H "Content-Type: application/json" \
              --fail \
              --silent \
              --show-error
            echo "Deploy triggered successfully"
          else
            echo "RENDER_DEPLOY_HOOK not set — skipping deploy trigger"
          fi